<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="leharGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3355"/>
      <stop offset="100%" stop-color="#C80024"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C80024" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container circle -->
  <circle cx="100" cy="100" r="92" fill="#111418" stroke="#262A30" stroke-width="2.5"/>
  
  <!-- LEHAR L-Wave Monogram -->
  <g filter="url(#glow)">
    <path d="M 124 76 C 118 52 94 48 80 66 C 66 84 72 116 56 140 C 47 154 32 147 36 132 C 40 118 58 128 86 136 C 114 144 144 140 156 122" 
          stroke="url(#leharGrad)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
</svg>
