    <use href="#sTP"  x="-55"  y="235"  width="135" height="270" transform="rotate(-13 -12 370)"/>
    <use href="#sK"   x="125"  y="255"  width="150" height="205" transform="rotate(27 200 357)"/>
    <use href="#sB"   x="-415" y="255"  width="145" height="230" transform="rotate(-32 -342 371)"/>
